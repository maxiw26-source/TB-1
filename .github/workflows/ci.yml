name: LSOB V7 CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Syntax check
        run: |
          python -m py_compile config.py strategy_v7.py backtest_v7.py strategy_breakout_v2.py backtest_breakout_v2.py bot_runtime.py telegram_approval.py bitunix_live.py live_paper_v7_hardened.py live_preflight.py selftest_v7.py selftest_live_guardrails.py selftest_strategy_expansion.py

      - name: Core selftest
        run: python selftest_v7.py

      - name: Live guardrail selftest
        run: python selftest_live_guardrails.py

      - name: Expansion strategy selftest
        run: python selftest_strategy_expansion.py
