name: LSOB V7 CI

on:
  push:
    branches:
      - main
      - "chatgpt/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Syntax check
        run: |
          python -m py_compile config.py strategy_v7.py backtest_v7.py backtest_sol_v7.py strategy_breakout_v2.py backtest_breakout_v2.py strategy_breakout_v3.py backtest_breakout_v3.py strategy_v8.py backtest_v8_walkforward.py backtest_btc_v8_multiblock.py backtest_bnb_v8_multiblock.py backtest_bnb_v8_long_history.py backtest_ada_v8_multiblock.py backtest_ada_v8_long_history.py test_v8_new_coins.py test_v8_ada_link.py test_bnb_v8_long_history.py test_ada_v8_long_history.py live_paper_v8_btc.py morning_summary.py two_hour_status.py selftest_morning_summary.py selftest_two_hour_status.py selftest_v8.py selftest_v8_paper.py bot_runtime.py telegram_approval.py bitunix_live.py live_partial_tp.py live_auto_mode.py live_paper_v7_hardened.py live_preflight.py selftest_v7.py selftest_live_guardrails.py selftest_live_partials.py selftest_auto_live.py selftest_strategy_expansion.py

      - name: Core selftest
        run: python selftest_v7.py

      - name: Live guardrail selftest
        run: python selftest_live_guardrails.py

      - name: Expansion strategy selftest
        run: python selftest_strategy_expansion.py

      - name: V8 selftest
        run: python selftest_v8.py

      - name: Live partial-profit selftest
        run: python selftest_live_partials.py

      - name: V8 paper monitor selftest
        run: python selftest_v8_paper.py

      - name: Auto-live arming selftest
        run: python selftest_auto_live.py

      - name: Morning summary selftest
        run: python selftest_morning_summary.py

      - name: Two-hour status selftest
        run: python selftest_two_hour_status.py
